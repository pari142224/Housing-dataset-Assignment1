name: ML Workflow CI

on:
  push:
    branches:
      - kernelridge

jobs:
  train-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run train.py
        run: python train.py

      - name: Run train2.py
        run: python train2.py
